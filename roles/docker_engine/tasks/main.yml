---
- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Install Docker from Ubuntu repository
  apt:
    name:
      - docker.io
    state: present

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true
