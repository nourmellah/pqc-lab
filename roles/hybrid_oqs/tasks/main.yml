---
- name: Install Python Docker SDK
  apt:
    name:
      - python3-docker
    state: present

- name: Ensure Docker service is running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Pull OQS Nginx image
  community.docker.docker_image:
    name: openquantumsafe/nginx
    source: pull

- name: Run OQS Nginx container
  community.docker.docker_container:
    name: oqs-nginx
    image: openquantumsafe/nginx
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "4433:4433"
    labels:
      lab.server_mode: hybrid
      lab.server_role: web

- name: Install hybrid status helper
  copy:
    dest: /usr/local/bin/pqc-hybrid-status
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      docker ps --filter name=oqs-nginx
      docker logs oqs-nginx --tail 30
